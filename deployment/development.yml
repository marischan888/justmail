services:
  db:
    build:
      context: ..
      dockerfile: deployment/postgres.Dockerfile
    container_name: justmail-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DATABASE__USERNAME: ${APP_DATABASE__USERNAME}
      APP_DATABASE__PASSWORD: ${APP_DATABASE__PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: justmail-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  justmail:
    container_name: justmail
    build:
      context: ..
      dockerfile:
        - development/justmail.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE__HOST=db
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__REQUIRE_SSL=false
      - APP_APPLICATION__BASE_URL=127.0.0.1
      - APP_REDIS_URI=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://justmail:8000/health_check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
